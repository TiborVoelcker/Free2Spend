[project]
name = "free2spend"
version = "0.1.0"
description = "Personal finance tool built on a single free-to-spend number."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Europe/Berlin is implied throughout (see AGENTS.md), and an export's own
# creation time carries no zone, so naive datetimes are deliberate.
ignore = ["DTZ001"]
